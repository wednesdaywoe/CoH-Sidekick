# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [rebuild, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The heap size that used to live here (NODE_OPTIONS: 14336) is now inside the
          # `build` script in package.json, invoked as `node --max-old-space-size=…` on
          # both tsc and vite. It had to move: a CLI flag overrides NODE_OPTIONS, and
          # setting it only here meant a developer's `npm run build` got Node's 4.3GB
          # default and died where CI passed. That is a build whose memory budget is
          # configured everywhere except where the build is.
          #
          # Going over doesn't fail the deploy loudly: the build OOMs and the Pages step
          # silently skips. 10240 was sized for three datasets; brainstorm made it four
          # and it measured 9.72GB peak RSS against that ceiling, ~3% headroom. On
          # 2026-09-17 the same build measures 11.3GB with maps (10.1GB without, which is
          # what a token-less run now costs — see vite.config.ts), so 14336 is down to
          # ~2.7GB of room on a 16GB runner. Re-measure before adding a dataset.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
