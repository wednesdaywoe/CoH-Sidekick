# Production build, WITHOUT deploying — the dry run for a Pages deploy.
#
# deploy.yml has no safe dry run: its `deploy` job publishes to the `github-pages`
# environment regardless of which branch dispatched it, and that environment IS the
# live site. Running it to "just check" ships to users. This workflow is the same
# build with the deploy half removed, so a branch can be proven before it reaches main.
#
# What it actually proves: that a stock GitHub-hosted runner — Node and nothing else —
# can build the app. That was false until the engine artifacts were committed
# (build:engine needs the private rebuild repo, a Rust toolchain, and a pinned
# wasm-bindgen CLI, none of which a hosted runner has). `ubuntu-latest` is therefore
# load-bearing: run this on the self-hosted box and it proves nothing, because that box
# has the rebuild checkout sitting next to it.
#
# Triggered by branch push, NOT workflow_dispatch alone — GitHub only offers the "Run
# workflow" button for workflows already on the default branch, so a dispatch-only
# version of this file would be undispatchable from the very branch it exists to
# vet. `workflow_dispatch` is kept for after it reaches main, where it becomes the
# better trigger (this build is heavy — ~10GB heap, sourcemaps for three datasets — and
# Actions minutes are a shared account pool). main and rebuild are excluded because a
# push to either already runs the real deploy; markdown-only commits are excluded
# because they cannot change the bundle.
#
# Then: download the `dist` artifact from the run summary and `npx serve dist`. Those
# are the exact bytes a deploy would publish, the CSP <meta> is enforced the same, and
# localhost counts as a secure origin so the service worker registers for real.
name: Build check (no deploy)

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, rebuild]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The heap size lives in package.json's `build` script now (see deploy.yml for
          # why). This step used to pin 10240 of its own, which had gone stale twice over:
          # deploy.yml raised itself to 14336 for the fourth dataset and this did not
          # follow, and this build now peaks at 10.7GB without maps (11.3GB with them) —
          # so the moment tsc stopped failing ahead of it, this job would have started
          # OOMing on a ceiling deploy had already abandoned. It never surfaced because
          # `tsc` has failed first on every run since 2026-09-10, so `vite build` has not
          # executed in CI since 09-08.
          #
          # Baked into the bundle, so the artifact is actually runnable in step 2.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # SENTRY_AUTH_TOKEN deliberately omitted: a test build should not create Sentry
          # releases. It now gates source-map GENERATION as well as upload (vite.config.ts),
          # so this artifact carries no .map files — deliberately. They would be maps no
          # tool here can read: `sourcemap: 'hidden'` emits no sourceMappingURL, so nothing
          # in the JS points at them and only an upload would have consumed them. The
          # shipped JS is unaffected, which is what step 2 checks.

      # A successful `vite build` does NOT imply a working engine — re-ignoring the
      # artifacts, or a stale/absent contract bundle, still produces a clean build that
      # renders 0% everywhere at runtime. Assert the engine actually landed in dist.
      - name: Assert the engine shipped
        run: |
          set -e
          ls dist/assets/*.wasm > /dev/null || { echo "::error::no .wasm in dist/assets — engine glue did not emit"; exit 1; }
          for ds in homecoming rebirth thunderspy; do
            test -s "dist/engine/contract/$ds.json.gz" || { echo "::error::missing dist/engine/contract/$ds.json.gz"; exit 1; }
          done
          grep -q "wasm-unsafe-eval" dist/index.html || { echo "::error::CSP lacks 'wasm-unsafe-eval' — Chrome will block the engine"; exit 1; }
          echo "engine present: $(ls dist/assets/*.wasm) + 3 contract bundles, CSP ok"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          # Sourcemaps are 92 of dist's 155 MB and useless here — `sourcemap: 'hidden'`
          # emits no sourceMappingURL, so a browser never fetches them. Excluding them
          # halves every upload and download. (They still ship on a real deploy, where
          # Sentry needs them.)
          path: |
            dist/
            !dist/**/*.map
          retention-days: 7
