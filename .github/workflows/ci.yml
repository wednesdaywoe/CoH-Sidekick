# Continuous Integration — type-check + tests (incl. the generated-data invariant scan)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # tsc and vitest both walk the whole generated/ tree, which outgrew Node's default
    # ~4GB heap: every run since 2026-08-26 died with "Ineffective mark-compacts near heap
    # limit" (exit 134) in the type-check step, before any assertion could be reached. That
    # is a red that says nothing about the code. Measured 2026-09-17: `tsc --noEmit` alone
    # peaks at 4.45GB RSS, i.e. it clears the default ceiling by nothing at all, which is
    # why it was the step that died. This job keeps its own NODE_OPTIONS because it never
    # runs `npm run build` — the build carries its own flag in package.json, and lint,
    # vitest and the audit scripts here would get the default without this.
    env:
      NODE_OPTIONS: --max-old-space-size=14336
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap, and before the install, because what it guards is what publishes this site.
      # Vacuously green here today — every action in this repository is GitHub's own, and the
      # rule deliberately allows those, since their trust root is the runner already executing
      # them. Its value is the day someone adds one that is not. Graded with --self-test rather
      # than only run: a check that has never been seen to refuse anything is a wish.
      # SECURITY_AUDIT.md F14.
      - name: third-party actions name a commit
        run: |
          python3 scripts/keys/actions-are-pinned.py --self-test
          python3 scripts/keys/actions-are-pinned.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      # Includes src/data/converter-invariants.test.ts — the structural invariant
      # scan over the committed generated/ data (export-name === internalName, no
      # bare specialBuff, no 0xFFFFFFFF sentinels, no new PvP-only mez tables).
      - name: Tests
        run: npm test

      # Fails if a malformed boostset poisoned a whole IO-set category across
      # many powers (the Thunderspy "KB"/SumoBoostName pollution class — it
      # handed "Melee Damage" to ~1387 ranged attacks). Covers the io-set
      # category data — including the Python-extracted io-sets-raw.ts — that the
      # generated/ regen-diff guard does not rebuild.
      - name: Audit IO-set categories (all datasets)
        run: npm run audit:set-categories

      # DSH3 (SC-2) collapse gate: fails if a resistible/unresistable debuff twin
      # in the parser export lost its `unresistable` companion in generated output
      # — the exact 2026-07-05 effect-collapse class, kept from silently
      # regressing. (DSH2 / SC-1, the AT-table referential-integrity guard, rides
      # the `npm test` step above as src/data/converter-table-integrity.test.ts.)
      - name: Validate converter output (collapse gate, all datasets)
        run: npm run validate:converter

  # The regen-and-diff guard (rebuild generated/ from committed exported_powers/
  # and assert byte-identity) now lives in its own workflow: .github/workflows/
  # regen-diff.yml. It regenerates generated/ for all three datasets (HC +
  # Rebirth + Thunderspy) and is the strongest drift guard — it catches ANY
  # converter change that wasn't re-committed, not just the known classes the
  # invariant scan above covers. NB it is scoped to generated/ only; the layered
  # at-tables / kheldian / pet-entities / index files are reconciled deliberately
  # and are NOT byte-gated (see regen-diff.yml).
