<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>OG Image - CoH Sidekick</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121417;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      padding: 60px 80px;
      position: relative;
      overflow: hidden;
    }

    /* Top border accent */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #D62BCE, transparent);
    }

    /* Subtle grid pattern */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(100, 116, 139, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 116, 139, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .logo-area {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    /* Radial glow, anchored to the logo so it follows the centred composition */
    .logo-area::before {
      content: '';
      position: absolute;
      width: 560px;
      height: 560px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(214, 43, 206, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-area img {
      position: relative;
      width: 280px;
      height: 280px;
      filter: drop-shadow(0 0 30px rgba(214, 43, 206, 0.3));
    }

    .text-area {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-name {
      font-size: 88px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .app-name span {
      font-style: italic;
      background: linear-gradient(135deg, #D62BCE 0%, #e879de 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-right: 10px;
    }

    /* nowrap keeps the slogan on one line — it is the only line of body copy */
    .tagline {
      font-size: 28px;
      font-weight: 400;
      color: #94a3b8;
      line-height: 1.35;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid-bg"></div>

    <div class="logo-area">
      <img src="img/favicon-512x512.png" alt="CoH Sidekick Logo">
    </div>

    <div class="text-area">
      <div class="app-name">CoH <span>SIDEKICK</span></div>
      <div class="tagline">A City of Heroes character planner for everyone</div>
    </div>
  </div>
</body>
</html>
